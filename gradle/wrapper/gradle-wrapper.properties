# unreachable from some networks), so fetch the distribution from a mirror instead, pinned to its checksum.
# Revert to https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip once gradle.org is healthy again.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-bin.zip
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=30000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
