# CC-Tweaked 中文版 - 构建工作流
# 自动构建 NeoForge 和 Fabric 版本的 JAR 文件

name: Build JAR

on:
  push:
    branches: [ mc-1.21.x ]
  pull_request:
    branches: [ mc-1.21.x ]
  workflow_dispatch:

permissions:
  contents: read
  packages: none

jobs:
  build-neoforge:
    name: Build NeoForge JAR
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clone repository
      uses: actions/checkout@v4

    - name: 📥 Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 📥 Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: ⚒️ Build Forge
      run: ./gradlew :forge:build --no-daemon

    - name: 📦 Find Forge JAR
      id: find-forge-jar
      run: |
        JAR_PATH=$(find projects/forge/build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
        echo "forge-jar=$JAR_PATH" >> $GITHUB_OUTPUT
        echo "Found: $JAR_PATH"

    - name: 📤 Upload Forge JAR
      uses: actions/upload-artifact@v4
      with:
        name: CC-Tweaked-Forge
        path: ${{ steps.find-forge-jar.outputs.forge-jar }}
        retention-days: 7

  build-fabric:
    name: Build Fabric JAR
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clone repository
      uses: actions/checkout@v4

    - name: 📥 Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 📥 Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: ⚒️ Build Fabric
      run: ./gradlew :fabric:build --no-daemon

    - name: 📦 Find Fabric JAR
      id: find-fabric-jar
      run: |
        JAR_PATH=$(find projects/fabric/build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
        echo "fabric-jar=$JAR_PATH" >> $GITHUB_OUTPUT
        echo "Found: $JAR_PATH"

    - name: 📤 Upload Fabric JAR
      uses: actions/upload-artifact@v4
      with:
        name: CC-Tweaked-Fabric
        path: ${{ steps.find-fabric-jar.outputs.fabric-jar }}
        retention-days: 7

  collect-jars:
    name: Collect All JARs
    runs-on: ubuntu-latest
    needs: [build-neoforge, build-fabric]

    steps:
    - name: 📥 Download NeoForge JAR
      uses: actions/download-artifact@v4
      with:
        name: CC-Tweaked-Forge
        path: ./jars/forge

    - name: 📥 Download Fabric JAR
      uses: actions/download-artifact@v4
      with:
        name: CC-Tweaked-Fabric
        path: ./jars/fabric

    - name: 📦 Prepare All JARs
      run: |
        mkdir -p jars/combined
        cp jars/forge/*.jar jars/combined/
        cp jars/fabric/*.jar jars/combined/
        ls -la jars/combined/

    - name: 📤 Upload All JARs
      uses: actions/upload-artifact@v4
      with:
        name: CC-Tweaked-All-JARs
        path: ./jars/combined
        retention-days: 30

  release:
    name: 🚀 发布到 Release
    runs-on: ubuntu-latest
    needs: [collect-jars]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: 📥 Download all JARs
      uses: actions/download-artifact@v4
      with:
        name: CC-Tweaked-All-JARs
        path: ./jars

    - name: 🚀 Upload to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        ls -la jars/
        tag="v1.120.2-1.21.1-zh"
        gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
               --title "CC-Tweaked 汉化版 v1.120.2 (Minecraft 1.21.1 · NeoForge/Fabric)" \
               --notes "由 CI 自动发布。"
        gh release upload "$tag" jars/*.jar --clobber --repo "$GITHUB_REPOSITORY"
