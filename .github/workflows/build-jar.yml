# CC-Tweaked 中文版 - 构建工作流
# 自动构建 Forge 和 Fabric 版本的 JAR 文件

name: Build JAR

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: none

jobs:
  build-forge:
    name: Build Forge JAR
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Clone repository
      uses: actions/checkout@v4

    - name: 📥 Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 📥 Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: ⚒️ Build Forge
      run: ./gradlew :forge:build --no-daemon

    - name: 📦 Find Forge JAR
      id: find-forge-jar
      run: |
        JAR_PATH=$(find projects/forge/build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
        echo "forge-jar=$JAR_PATH" >> $GITHUB_OUTPUT
        echo "Found: $JAR_PATH"

    - name: 📤 Upload Forge JAR
      uses: actions/upload-artifact@v4
      with:
        name: CC-Tweaked-Forge
        path: ${{ steps.find-forge-jar.outputs.forge-jar }}
        retention-days: 7

  build-fabric:
    name: Build Fabric JAR
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Clone repository
      uses: actions/checkout@v4

    - name: 📥 Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 📥 Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: ⚒️ Build Fabric
      run: ./gradlew :fabric:build --no-daemon

    - name: 📦 Find Fabric JAR
      id: find-fabric-jar
      run: |
        JAR_PATH=$(find projects/fabric/build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
        echo "fabric-jar=$JAR_PATH" >> $GITHUB_OUTPUT
        echo "Found: $JAR_PATH"

    - name: 📤 Upload Fabric JAR
      uses: actions/upload-artifact@v4
      with:
        name: CC-Tweaked-Fabric
        path: ${{ steps.find-fabric-jar.outputs.fabric-jar }}
        retention-days: 7

  build-all:
    name: Build All JARs
    runs-on: ubuntu-latest
    needs: [build-forge, build-fabric]
    
    steps:
    - name: 📥 Clone repository
      uses: actions/checkout@v4

    - name: 📥 Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 📥 Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: ⚒️ Build All
      run: ./gradlew assemble --no-daemon

    - name: 📦 Prepare All JARs
      run: |
        mkdir -p jars
        # Copy Forge JARs
        find projects/forge/build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} jars/ \;
        # Copy Fabric JARs
        find projects/fabric/build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} jars/ \;
        ls -la jars/

    - name: 📤 Upload All JARs
      uses: actions/upload-artifact@v4
      with:
        name: CC-Tweaked-All-JARs
        path: ./jars
        retention-days: 30
